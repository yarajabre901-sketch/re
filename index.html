<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آثار الأردن بتتبع اليد</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<style>
:root{--cy:#4fd8ff;--sand:#d9b77e;--bg:rgba(6,14,22,.84)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a141c;overflow:hidden;font-family:'Noto Kufi Arabic','Noto Sans KR','Malgun Gothic',Tahoma,sans-serif;color:#e8f6ff}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover;transform:scaleX(-1);background:#111}
#fx{z-index:20;pointer-events:none}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 20px;cursor:pointer;background:var(--cy);color:#06202c}
button.alt{background:transparent;color:var(--cy);border:2px solid var(--cy)}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
#home{position:fixed;inset:0;z-index:5;background:var(--bg);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;gap:16px;padding:calc(26px + env(safe-area-inset-top,0px)) 20px 90px;overflow:auto}
#home h1{margin:0;font-size:30px;color:var(--cy);letter-spacing:.5px}
#home p{margin:0;color:#a9c9d8;max-width:640px;text-align:center;line-height:1.8}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:min(1120px,100%)}
.site{position:relative;text-align:right;background:rgba(10,32,46,.75);color:#e8f6ff;border:2px solid rgba(79,216,255,.45);border-radius:12px;padding:16px 16px 14px;font-weight:400;line-height:1.7;transition:.15s}
.site:hover,.site:focus-visible{border-color:var(--cy);background:rgba(20,60,84,.85)}
.site .ic{font-size:34px}.site b{display:block;font-size:20px;color:#fff}
.site small{display:block;color:#a9c9d8;font-size:12.5px}
.site .st{margin-top:8px;color:var(--sand);font-size:13px}
#hud{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:none;align-items:center;gap:12px;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .t{flex:1;text-align:center;text-shadow:0 1px 4px #000;pointer-events:none}
#hud .t b{font-size:20px}#hud .t small{display:block;color:#cfe;font-size:12px}
#hud .n{background:rgba(6,14,22,.75);border:1px solid var(--cy);border-radius:999px;padding:6px 14px;font-size:13px}
#card{position:fixed;z-index:7;display:none;top:calc(74px + env(safe-area-inset-top,0px));right:14px;width:340px;max-height:calc(100% - 160px);overflow:auto;background:rgba(6,14,22,.9);border:1px solid var(--cy);border-radius:10px;padding:16px;box-shadow:0 0 24px rgba(79,216,255,.25)}
#card.on{display:block}
#card h3{margin:0 0 2px;font-size:19px;color:var(--cy)}#card .sub{font-size:12px;color:#a9c9d8;margin-bottom:10px}
#card .row{padding:7px 0;border-top:1px dashed rgba(79,216,255,.3);font-size:13.5px;line-height:1.8}
#card .row b{display:block;color:var(--sand);font-size:12px}
#cx{position:absolute;top:8px;left:8px;padding:2px 10px;font-size:18px}
#cap{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:rgba(6,14,22,.7);border:1px solid rgba(79,216,255,.4);padding:9px 18px;border-radius:999px;font-size:13.5px;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hint{position:fixed;z-index:8;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:15px;color:#fff;text-shadow:0 1px 4px #000;pointer-events:none;text-align:center;width:70vw}
#ov{position:fixed;z-index:30;inset:0;background:rgba(6,14,22,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#ov h1{margin:0;font-size:30px;color:var(--cy)}#ov p{max-width:520px;line-height:1.9;margin:0;color:#cfe4ee}
#tray{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));display:none;gap:10px}
.tl{background:rgba(6,14,22,.82);color:#e8f6ff;border:2px solid rgba(79,216,255,.4);padding:7px 14px;font-weight:400;font-size:22px;line-height:1.3}
.tl small{display:block;font-size:12px}.tl.on{border-color:#ffd24f;background:rgba(70,56,10,.9)}
body.dig video{inset:auto;left:12px;bottom:12px;width:150px;height:112px;z-index:9;border:2px solid var(--cy);border-radius:8px}
#map img{position:absolute;left:0;top:0;pointer-events:none}.mclip{position:absolute;inset:0;overflow:hidden;pointer-events:none}#mimg{transform-origin:0 0}.rg{fill:none;stroke:rgba(79,216,255,.35)}.rt{fill:#a9c9d8;font-size:11px}.dt{fill:#ffd24f;font-size:12px;text-anchor:middle}#map{position:relative;margin:6px auto 0;flex:none}#map svg{position:absolute;inset:0;overflow:visible}
.gr line{stroke:rgba(79,216,255,.12)}.jo{fill:rgba(79,216,255,.08);stroke:#4fd8ff;stroke-width:2;filter:drop-shadow(0 0 6px rgba(79,216,255,.6))}.ds{fill:rgba(60,120,200,.55);stroke:#6fb0ff}
.cn{fill:#a9c9d8;font-size:11px;text-anchor:middle}.jn{fill:rgba(79,216,255,.35);font-size:22px;font-weight:700;text-anchor:middle}
.ld{stroke:rgba(255,210,79,.7);stroke-width:1.2;stroke-dasharray:4 3}.pulse{fill:none;stroke:#ffd24f;transform-box:fill-box;transform-origin:center;animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.scan{fill:rgba(79,216,255,.5);animation:sc 5s linear infinite}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(100%)}}
.chip{position:absolute;transform:translate(-50%,-50%);min-width:150px;padding:8px 12px;text-align:center}.chip .ic{font-size:22px}.chip b{font-size:16px}.chip small{font-size:11px}.chip .st{margin-top:4px;font-size:11.5px}
.mclip img{transform-origin:0 0}.lens{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none;background:#04090d}.lens img{position:absolute;left:0;top:0;transform-origin:0 0;filter:blur(1.2px) brightness(.85)}
.lr{fill:none;stroke:#4fd8ff;stroke-width:2;filter:drop-shadow(0 0 6px rgba(79,216,255,.8))}.lt{fill:#4fd8ff;font-size:13px;font-weight:700;text-anchor:middle}
.sweep{stroke:rgba(79,216,255,.75);stroke-width:2;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chip.sm{min-width:0;width:auto;white-space:nowrap;padding:5px 12px}.chip.sm b{font-size:15px}.chip.sm small{font-size:10.5px}
#lwrap{position:relative;width:min(1180px,96vw);flex:none;border:1px solid rgba(79,216,255,.45);border-radius:12px;overflow:hidden;box-shadow:0 0 22px rgba(79,216,255,.18)}
#lwrap #lmap{position:absolute;inset:0}#lzoom{position:absolute;left:12px;top:12px;width:340px;height:300px;z-index:900;border:2px solid #4fd8ff;border-radius:12px;overflow:hidden;box-shadow:0 0 16px rgba(79,216,255,.55);background:#06121a}
#lz{position:absolute;inset:0}.lzt{position:absolute;z-index:1000;left:0;right:0;top:0;text-align:center;font-size:12px;font-weight:700;color:#4fd8ff;background:rgba(6,14,22,.75);padding:3px}
#lall{position:absolute;z-index:900;right:12px;bottom:34px;transform:none;min-width:0;padding:6px 12px;font-size:13px}
.mk{position:relative;width:0;height:0}.mk .mdot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#ffd24f;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,210,79,.7)}70%{box-shadow:0 0 0 14px rgba(255,210,79,0)}100%{box-shadow:0 0 0 0 rgba(255,210,79,0)}}
.mk .chip{position:absolute;transform:none;min-width:0;width:max-content;padding:5px 10px;text-align:center}.mk .chip b{font-size:14px}.mk .chip small{font-size:10.5px}
.mk.pr .chip{left:16px;top:-24px}.mk.pl .chip{right:16px;top:-24px}.mk.pb .chip{left:-46px;top:16px}
.kmt{background:rgba(6,14,22,.8);border:1px solid #ffd24f;color:#ffd24f;font-size:11px;padding:1px 5px}
.leaflet-control-zoom a{background:rgba(6,14,22,.88)!important;color:#4fd8ff!important;border-color:#4fd8ff!important}
.leaflet-control-attribution,.leaflet-control-scale-line{background:rgba(6,14,22,.7)!important;color:#a9c9d8!important;border-color:#4fd8ff!important}
/* حركة الخريطة: الخطوط تجري، والبطاقات تظهر تباعاً، والعدسة تتنفس، والخريطة تميل مع يدك */
#map{will-change:transform}
.ld{stroke-dasharray:5 4;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-9}}
#map .chip{animation:pop .5s backwards}@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}}
#map .chip:nth-of-type(2){animation-delay:.1s}#map .chip:nth-of-type(3){animation-delay:.2s}#map .chip:nth-of-type(4){animation-delay:.3s}#map .chip:nth-of-type(5){animation-delay:.4s}
.lens{animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 0 34px rgba(79,216,255,.6)}}
#lang{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;padding:6px 12px;font-size:12.5px;background:rgba(6,14,22,.8)}
html[dir=ltr] .site{text-align:left}html[dir=ltr] .chip{text-align:center}html[dir=ltr] #cx{left:auto;right:8px}
.chip{max-width:165px}.chip small{white-space:normal;line-height:1.35}
@media(max-width:800px){#card{top:auto;bottom:64px;left:8px;right:8px;width:auto;max-height:42vh}#home h1{font-size:22px}}
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="cv"></canvas>
<div id="home"></div>
<div id="hud"><button class="alt" id="back" data-act data-i="back">→ الخريطة</button><div class="t"><b id="ht"></b><small id="hs"></small></div><div class="n" id="hn"></div><button class="alt" id="vrb" data-act>🥽 VR</button></div>
<div id="card"></div>
<div id="tray"><button class="tl" data-act data-t="pick">⛏️<small data-i="tpick">معول ✊</small></button><button class="tl on" data-act data-t="brush">🖌️<small data-i="tbrush">فرشاة ☝</small></button><button class="tl" data-act data-t="doc">📷<small data-i="tdoc">توثيق ✌</small></button></div>
<div id="hint"></div>
<button id="lang" class="alt" data-act data-i="lang" aria-label="Language">🌐 العربية</button>
<div id="cap"></div>
<canvas id="fx"></canvas>
<div id="ov">
  <h1 data-i="title">آثار الأردن بتتبع اليد</h1>
  <p data-i="ov1">ابدأ من الخريطة التفاعلية للمواقع الأثرية في الأردن، ثم ادخل موقعاً لتجد قطعه مدفونة تحت الرمل. اكشفها بالفرشاة، ثم أشِر إلى القطعة لتُطبَع بياناتها أمامك.</p>
  <p data-i="ov2">✊ قبضة = معول &nbsp; ☝ سبابة = فرشاة (وثبّتها ثانية على أي زر لتضغطه) &nbsp; ✌ إصبعان = توثيق القطعة &nbsp; ✋ كفّ مفتوحة = رجوع</p>
  <div><button id="goCam" data-i="goCam">تشغيل الكاميرا</button> <button class="alt" id="goMouse" data-i="goMouse">تجربة بالماوس</button></div>
</div>

const kmBetween=(a,b)=>{const r=Math.PI/180,p1=a[1]*r,p2=b[1]*r,dl=(b[0]-a[0])*r,dp=p2-p1,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 12742*Math.asin(Math.sqrt(h))};

  const Lcx=L/2,Lcy=H*.31,Rl=H*.255,sl=(Rl/LENS_KM)/1.3065,A=toImg(...HUB);

  const Z=i=>{const q=toImg(...LL[i]);return[Lcx+(q[0]-A[0])*sl,Lcy+(q[1]-A[1])*sl]}; // النقطة داخل العدسة
  const hub=[L+A[0]*k,A[1]*k],dx=hub[0]-Lcx,dy=hub[1]-Lcy,dl=Math.hypot(dx,dy),ce=[Lcx+dx/dl*Rl,Lcy+dy/dl*Rl];

function setCap(){

// ===== الدخول إلى موقع التنقيب (مشهد ثلاثي الأبعاد بمنظور الشخص الأول) =====
const COLS=48,ROWS=36,CD=.2,X0=-4.8,FLOORY=-.42,HITY=-.2,CAMY=7.2,CAMZ=-3.2,PITCH=.95,FK=.64;
const SP=Math.sin(PITCH),CP=Math.cos(PITCH),V={cx:0,cy:0,F:1,ex:0},ORD=[];
let headX=0,GS=[],vr=false,hit=null,curTool=null;
for(let i=0;i<24;i++)ORD.push(i);for(let i=COLS-1;i>=24;i--)ORD.push(i);
const hOf=d=>d>1?-.12*(2-d):-.12-.3*(1-d);
const hgt=(i,j)=>{if(i<0||i>=COLS||j<0||j>=ROWS)return 0;const d=depth[j*COLS+i];return d<=0?FLOORY:hOf(d)};
const pj=(X,Y,Z)=>{const vx=X-(V.ex+headX),vy=Y-CAMY,vz=Z-CAMZ,yc=vy*CP+vz*SP,zc=-vy*SP+vz*CP;return[V.cx+V.F*vx/zc,V.cy-V.F*yc/zc,zc]};
function enter(site){
  scene='dig';cur=site;pal=PALS[SITES.indexOf(site)];closeCard();docN=0;dust=[];lastB=null;lastTool=null;
  site.pieces.forEach(p=>SEEN.delete(p.id));
  document.body.classList.add('dig');$('home').style.display='none';$('hud').style.display='flex';$('tray').style.display='flex';
  $('ht').textContent=tr('here')+site.name;$('hs').textContent=site.region+' · '+site.period;updN();
  const N=COLS*ROWS;depth=new Float32Array(N).fill(2);cC=[];sC=[];
  for(let k=0;k<N;k++){const n=Math.random(),a=1-.3*n,b=1-.18*n;
    cC.push(`rgb(${pal.crust[0]*a|0},${pal.crust[1]*a|0},${pal.crust[2]*a|0})`);sC.push(`rgb(${pal.soil[0]*b|0},${pal.soil[1]*b|0},${pal.soil[2]*b|0})`)}
  const W=COLS*CD,D=ROWS*CD,n=site.pieces.length,sw=W/n;
  pcs=site.pieces.map((p,i)=>{const im=IM[p.img],s=Math.min(sw*.8/im.width,D*(n>1?.55:.85)/im.height),w=im.width*s,d=im.height*s;
    return{...p,im,w,d,tag:0,x:X0+i*sw+(sw-w)/2,z:(D-d)/2+(n>1?(i%2?1:-1)*D*.1:0)}});
  GS=[];for(let i=0;i<500;i++){const x=(Math.random()-.5)*34,z=Math.random()*26-7;if(Math.abs(x)<5.2&&z>-.3&&z<7.5)continue;GS.push([x,z,Math.random()<.5?0:1])}

const sqOf=p=>String.fromCharCode(65+Math.min(11,Math.floor((p.x+p.w/2-X0)/(4*CD))))+(Math.min(8,Math.floor((p.z+p.d/2)/(4*CD)))+1);
function rayAt(sx,sy){
  const aw=vr?cw/2:cw-(cw>900?360:0),x=vr?sx/2:sx,cx=aw/2,cy=ch*.5+45,F=aw*FK,u=cy-sy,dy=-SP*F+CP*u,dz=CP*F+SP*u;
  if(dy>=-1e-6)return null;const t=(HITY-CAMY)/dy;return{x:headX+t*(x-cx),z:CAMZ+t*dz};

function goHome(){scene='home';closeCard();renderHome();document.body.classList.remove('dig');$('home').style.display='flex';$('hud').style.display='none';$('tray').style.display='none';setCap()}
function back(){if($('card').classList.contains('on'))closeCard();else if(scene==='dig')goHome();}

$('vrb').onclick=toggleVR;
document.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{mTool=b.dataset.t});

// ===== الحفر =====
function digAt(x,z,tool){
  const R=tool==='brush'?.9:.6,gi=(x-X0)/CD,gj=z/CD,r=R/CD;let rock=false,hitc=false;
  for(let j=Math.max(0,Math.floor(gj-r));j<=Math.min(ROWS-1,Math.floor(gj+r));j++)for(let i=Math.max(0,Math.floor(gi-r));i<=Math.min(COLS-1,Math.floor(gi+r));i++){
    if(Math.hypot(i+.5-gi,j+.5-gj)>r)continue;const k=j*COLS+i,d=depth[k];
    if(tool==='pick'){if(d>1){depth[k]=Math.max(1,d-.09);hitc=true}}
    else if(d>1)rock=true;else if(d>0){depth[k]=Math.max(0,d-.14);hitc=true}
  }
  if(hitc&&Math.random()<.5)dust.push({x:x+(Math.random()-.5)*.8,y:HITY,z:z+(Math.random()-.5)*.8,vx:(Math.random()-.5)*1.2,vy:1+Math.random()*1.5,vz:(Math.random()-.5)*1.2,l:0,r:.05+Math.random()*.06});
  if(rock)say(tr('rock'));
}
function cellsOf(p,f){const i0=Math.max(0,Math.floor((p.x-X0)/CD)),i1=Math.min(COLS-1,Math.floor((p.x+p.w-X0)/CD)),j0=Math.max(0,Math.floor(p.z/CD)),j1=Math.min(ROWS-1,Math.floor((p.z+p.d)/CD));let n=0,c=0;for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){c++;if(f(depth[j*COLS+i]))n++}return c?n/c:0}
const reveal=p=>cellsOf(p,d=>d<=.25),rockOver=p=>cellsOf(p,d=>d>1)>0;
const hitPiece=h=>h&&pcs.find(p=>h.x>=p.x&&h.x<=p.x+p.w&&h.z>=p.z&&h.z<=p.z+p.d&&reveal(p)>=REV);
function stage(){
  const un=pcs.filter(p=>!SEEN.has(p.id));
  if(!un.length)return tr('stDone');
  if(un.some(p=>reveal(p)>=REV))return tr('st3');
  if(un.some(rockOver))return tr('st1');
  return tr('st2');
}

// ===== بطاقة البيانات (تُطبع حرفاً حرفاً) =====
function closeCard(){tok++;curPiece=null;$('card').className='';$('card').innerHTML=''}
async function openCard(p){
  const t=++tok;curPiece=p;const c=$('card');c.className='on';
  c.innerHTML=`<button class="alt" id="cx" data-act>×</button><h3>${p.title}</h3><div class="sub">${cur.name} · ${cur.region}</div><div id="rows"></div>`;
  $('cx').onclick=closeCard;
  if(!SEEN.has(p.id)){SEEN.add(p.id);p.tag=++docN;updN()}
  if(cur.pieces.every(q=>SEEN.has(q.id))){DONE.add(SITES.indexOf(cur));say(tr('doneAt')+cur.name)}
  const rows=$('rows');
  for(const [l,v] of p.f.concat([[tr('recLoc'),tr('sq')+sqOf(p)]])){const r=document.createElement('div');r.className='row';r.innerHTML=`<b>${l}</b><span></span>`;rows.append(r);const s=r.lastChild;
    for(let i=0;i<v.length;i+=3){if(t!==tok)return;s.textContent=v.slice(0,i+3);await sleep(12)}s.textContent=v}
}

const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function onResults(res){
  hand=(res.multiHandLandmarks&&res.multiHandLandmarks[0])||null;let m='none';
  if(hand){const up=fingersUp(hand),n=up.filter(Boolean).length;
    if(n===0)m='fist';else if(up[0]&&n===1)m='point';else if(up[0]&&up[1]&&n===2)m='peace';else if(n===4)m='open'}
  if(m===cand)candN++;else{cand=m;candN=1}if(candN>=3)mode=m;
}
function mapPt(l){const vw=video.videoWidth||640,vh=video.videoHeight||480,sc=Math.max(cw/vw,ch/vh);return{x:cw-(l.x*vw*sc+(cw-vw*sc)/2),y:l.y*vh*sc+(ch-vh*sc)/2}}

function dwell(dt){
  let key=null,fn=null;
  if(ptr.on&&!usingMouse){
    if(mode==='point'){const el=document.elementFromPoint(ptr.x,ptr.y),a=el&&el.closest('[data-act]');if(a){key=a;fn=()=>a.click()}}
    else if(scene==='dig'&&mode==='peace'){const p=hitPiece(hit);if(p&&p!==curPiece){key=p;fn=()=>openCard(p)}}
  }
  if(key&&key===dw.k)dw.t+=dt;else{dw.k=key;dw.t=0}
  if(key&&dw.t>=1){dw.t=-1.5;fn()}
}

// ===== رسم المشهد ثلاثي الأبعاد =====
function poly(pts,col,stroke,shade){
  ctx.beginPath();for(let i=0;i<pts.length;i++){const q=pj(pts[i][0],pts[i][1],pts[i][2]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.closePath();
  if(col){ctx.fillStyle=col;ctx.fill();if(shade){ctx.fillStyle='rgba(0,0,0,.32)';ctx.fill()}}if(stroke)ctx.stroke();
}
function tri(img,x0,y0,x1,y1,x2,y2,u0,v0,u1,v1,u2,v2){
  ctx.save();ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.closePath();ctx.clip();
  const d=u0*(v1-v2)+u1*(v2-v0)+u2*(v0-v1);if(!d){ctx.restore();return}
  ctx.transform((x0*(v1-v2)+x1*(v2-v0)+x2*(v0-v1))/d,(y0*(v1-v2)+y1*(v2-v0)+y2*(v0-v1))/d,(x0*(u2-u1)+x1*(u0-u2)+x2*(u1-u0))/d,(y0*(u2-u1)+y1*(u0-u2)+y2*(u1-u0))/d,
   (x0*(u1*v2-u2*v1)+x1*(u2*v0-u0*v2)+x2*(u0*v1-u1*v0))/d,(y0*(u1*v2-u2*v1)+y1*(u2*v0-u0*v2)+y2*(u0*v1-u1*v0))/d);
  ctx.drawImage(img,0,0);ctx.restore();
}
function drawPiece(p){
  const m=.08;poly([[p.x-m,FLOORY,p.z-m],[p.x+p.w+m,FLOORY,p.z-m],[p.x+p.w+m,FLOORY,p.z+p.d+m],[p.x-m,FLOORY,p.z+p.d+m]],'#f4ead2');
  const n=6,iw=p.im.width,ih=p.im.height,P=(a,b)=>{const q=pj(p.x+p.w*a/n,FLOORY,p.z+p.d*(1-b/n));return[q[0],q[1]]};
  for(let a=0;a<n;a++)for(let b=0;b<n;b++){const q00=P(a,b),q10=P(a+1,b),q11=P(a+1,b+1),q01=P(a,b+1),u0=a/n*iw,u1=(a+1)/n*iw,v0=b/n*ih,v1=(b+1)/n*ih;
    tri(p.im,q00[0],q00[1],q10[0],q10[1],q11[0],q11[1],u0,v0,u1,v0,u1,v1);tri(p.im,q00[0],q00[1],q11[0],q11[1],q01[0],q01[1],u0,v0,u1,v1,u0,v1)}
}
function drawTent(){
  poly([[-9,0,9],[-9,0,12.7],[-7.2,2.2,12.7],[-7.2,2.2,9]],'rgb(205,196,170)');
  poly([[-5.4,0,9],[-5.4,0,12.7],[-7.2,2.2,12.7],[-7.2,2.2,9]],'rgb(236,228,204)');
  poly([[-9,0,9],[-5.4,0,9],[-7.2,2.2,9]],'rgb(222,212,184)');poly([[-8,0,9],[-6.4,0,9],[-7.2,1.2,9]],'#2a1c10');
}
function drawHeap(){
  const cx=7.6,cz=2.6,R=1.9,H=1.2,n=16,arr=[];for(let k=0;k<n;k++)arr.push([k/n*6.283,(k+1)/n*6.283]);
  arr.sort((p,q)=>Math.sin(q[0])-Math.sin(p[0]));
  arr.forEach(([a,b])=>{const sh=.72+.28*Math.cos((a+b)/2-2.4);poly([[cx+R*Math.cos(a),0,cz+R*Math.sin(a)],[cx+R*Math.cos(b),0,cz+R*Math.sin(b)],[cx,H,cz]],`rgb(${pal.soil.map(v=>v*sh|0).join(',')})`)});
}
function render3D(ex,vx,vw){
  ctx.save();ctx.beginPath();ctx.rect(vx,0,vw,ch);ctx.clip();
  const aw=vw-(vw===cw&&cw>900?360:0);V.cx=vx+aw/2;V.cy=ch*.5+45;V.F=aw*FK;V.ex=ex;
  ctx.fillStyle=pal.out;ctx.fillRect(vx,0,vw,ch);
  for(const [x,z,w] of GS){const q=pj(x,0,z);if(q[2]<.5)continue;const s=Math.max(1.5,.06*V.F/q[2]);ctx.fillStyle=w?'rgba(255,255,255,.1)':'rgba(0,0,0,.12)';ctx.fillRect(q[0],q[1],s*1.8,s)}
  drawTent();drawHeap();
  const W=COLS*CD,D=ROWS*CD;
  poly([[X0,FLOORY,0],[X0+W,FLOORY,0],[X0+W,FLOORY,D],[X0,FLOORY,D]],`rgb(${pal.floor.join(',')})`);
  pcs.forEach(drawPiece);
  for(let j=ROWS-1;j>=0;j--)for(const i of ORD){
    const k=j*COLS+i,d=depth[k],h=hgt(i,j),xa=X0+i*CD,xb=xa+CD,za=j*CD,zb=za+CD,wc=d>1||d<=0?cC[k]:sC[k];
    if(d>0)poly([[xa,h,za],[xb,h,za],[xb,h,zb],[xa,h,zb]],wc);
    if(j>0){const hf=hgt(i,j-1);if(hf<h)poly([[xa,h,za],[xb,h,za],[xb,hf,za],[xa,hf,za]],wc,0,1)}
    if(i<24){if(i<COLS-1){const hr=hgt(i+1,j);if(hr<h)poly([[xb,h,za],[xb,h,zb],[xb,hr,zb],[xb,hr,za]],wc,0,1)}if(i===0&&h<0)poly([[xa,0,za],[xa,0,zb],[xa,h,zb],[xa,h,za]],wc,0,1)}
    else{const hl=hgt(i-1,j);if(hl<h)poly([[xa,h,za],[xa,h,zb],[xa,hl,zb],[xa,hl,za]],wc,0,1);if(i===COLS-1&&h<0)poly([[xb,0,za],[xb,0,zb],[xb,h,zb],[xb,h,za]],wc,0,1)}
    if(j===ROWS-1&&h<0)poly([[xa,0,zb],[xb,0,zb],[xb,h,zb],[xa,h,zb]],wc,0,1);
  }
  poly([[X0-30,0,-9],[X0+W+30,0,-9],[X0+W+30,0,0],[X0-30,0,0]],pal.out);
  for(const [x,z,w] of GS){if(z>=0||z<-7)continue;const q=pj(x,0,z);if(q[2]<.5)continue;const s=Math.max(1.5,.06*V.F/q[2]);ctx.fillStyle=w?'rgba(255,255,255,.1)':'rgba(0,0,0,.12)';ctx.fillRect(q[0],q[1],s*1.8,s)}
  // خيوط المربعات الأثرية فوق الحفرة
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<=COLS;i+=4){const a=pj(X0+i*CD,0,0),b=pj(X0+i*CD,0,D);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}
  for(let j=0;j<=ROWS;j+=4){const a=pj(X0,0,j*CD),b=pj(X0+W,0,j*CD);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.stroke();
  ctx.fillStyle='rgba(20,12,6,.85)';ctx.textAlign='center';
  for(let k=0;k<12;k++){const q=pj(X0+(k+.5)*4*CD,0,D+.45);ctx.font=`700 ${Math.max(10,.3*V.F/q[2])}px sans-serif`;ctx.fillText(String.fromCharCode(65+k),q[0],q[1])}
  for(let k=0;k<9;k++){const q=pj(X0+W+.5,0,(k+.5)*4*CD);ctx.font=`700 ${Math.max(10,.3*V.F/q[2])}px sans-serif`;ctx.fillText(k+1,q[0],q[1])}
  // إطارات القطع وعلاماتها
  pcs.forEach(p=>{const m=.12,f=[[p.x-m,FLOORY,p.z-m],[p.x+p.w+m,FLOORY,p.z-m],[p.x+p.w+m,FLOORY,p.z+p.d+m],[p.x-m,FLOORY,p.z+p.d+m]];
    if(SEEN.has(p.id)){ctx.strokeStyle='#2f8f87';ctx.lineWidth=3;poly(f,0,1);const q=pj(p.x+p.w,.35,p.z+p.d),r=Math.max(10,.22*V.F/q[2]);
      ctx.fillStyle='#2f8f87';ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font=`700 ${r*1.2}px sans-serif`;ctx.fillText(p.tag||'✓',q[0],q[1]+r*.4)}
    else if(reveal(p)>=REV){ctx.setLineDash([8,6]);ctx.strokeStyle='#4fd8ff';ctx.lineWidth=3;poly(f,0,1);ctx.setLineDash([])}});
  // أوتاد وخيط الحفرة
  const sx0=X0-.3,sx1=X0+W+.3,sz1=D+.3,corners=[[sx0,-.3],[sx1,-.3],[sx1,sz1],[sx0,sz1]];
  ctx.strokeStyle='rgba(255,90,70,.9)';ctx.lineWidth=2;poly(corners.map(c=>[c[0],.7,c[1]]),0,1);
  ctx.strokeStyle='#6b4a2a';ctx.lineWidth=4;corners.forEach(c=>{const a=pj(c[0],0,c[1]),b=pj(c[0],.9,c[1]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()});
  dust.forEach(q=>{const s=pj(q.x,q.y,q.z);ctx.globalAlpha=Math.max(0,1-q.l/.7);ctx.fillStyle=`rgb(${pal.soil.join(',')})`;ctx.beginPath();ctx.arc(s[0],s[1],Math.max(1.5,q.r*V.F/s[2]),0,7);ctx.fill()});ctx.globalAlpha=1;
  if(hit){ // المؤشر ثلاثي الأبعاد: حلقة على الأرض وأداة فوقها
    const R=curTool==='brush'?.9:curTool==='pick'?.6:.3;ctx.strokeStyle='#4fd8ff';ctx.lineWidth=3;ctx.beginPath();
    for(let k=0;k<=28;k++){const a=k/28*6.283,q=pj(hit.x+R*Math.cos(a),HITY,hit.z+R*Math.sin(a));k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}ctx.stroke();
    if(curTool){const q=pj(hit.x,HITY+.8,hit.z);ctx.font=`${Math.max(20,.9*V.F/q[2])}px sans-serif`;ctx.textAlign='center';ctx.fillText(curTool==='pick'?'⛏️':curTool==='brush'?'🖌️':'📷',q[0],q[1])}
  }
  ctx.restore();
}
const tilt={x:0,y:0};
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,cw,ch);fx.clearRect(0,0,cw,ch);
  let pts=null;
  if(usingMouse){ptr.on=mouse.in;ptr.x=mouse.x;ptr.y=mouse.y;mode=mouse.down?'point':'none'}
  else if(hand){pts=hand.map(mapPt);const t=(mode==='fist'||mode==='open')?pts[9]:pts[8];if(!ptr.on){ptr.x=t.x;ptr.y=t.y}ptr.x+=(t.x-ptr.x)*.55;ptr.y+=(t.y-ptr.y)*.55;ptr.on=true}
  else{ptr.on=false;mode='none'}
  const tool=scene==='dig'?(usingMouse?mTool:(TOOLS[mode]||null)):null;curTool=tool;

  if(scene==='dig'){
    headX+=((Math.min(1,Math.max(0,ptr.x/cw))-.5)*1.4+Math.sin(now/1400)*.05-headX)*.04; // حركة الرأس تتبع اليد
    hit=ptr.on?rayAt(ptr.x,ptr.y):null;
    if(tool!==lastTool){lastTool=tool;document.querySelectorAll('.tl').forEach(b=>b.classList.toggle('on',b.dataset.t===tool))}
    const over=ptr.on&&(usingMouse||document.elementFromPoint(ptr.x,ptr.y)===cv),act=usingMouse?mouse.down:true;
    if((tool==='pick'||tool==='brush')&&over&&act&&hit){
      const x1=lastB?lastB.x:hit.x,z1=lastB?lastB.z:hit.z,n=Math.max(1,Math.ceil(Math.hypot(hit.x-x1,hit.z-z1)/.25));
      for(let k=1;k<=n;k++)digAt(x1+(hit.x-x1)*k/n,z1+(hit.z-z1)*k/n,tool);lastB={x:hit.x,z:hit.z};
    }else lastB=null;
    for(let i=dust.length-1;i>=0;i--){const q=dust[i];q.l+=dt;if(q.l>.7){dust.splice(i,1);continue}q.vy-=6*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt}
    if(vr){render3D(-.14,0,cw/2);render3D(.14,cw/2,cw/2);ctx.fillStyle='#000';ctx.fillRect(cw/2-1,0,2,ch)}else render3D(0,0,cw);
    if(now-stepT>400){stepT=now;setCap()}
  }
  if(scene==='home'){const m=$('map');if(m){const tx=ptr.on?ptr.x/cw-.5:0,ty=ptr.on?ptr.y/ch-.5:0;tilt.x+=(tx-tilt.x)*.06;tilt.y+=(ty-tilt.y)*.06;m.style.transform=`perspective(1200px) rotateX(${-tilt.y*5}deg) rotateY(${tilt.x*7}deg)`}}
  dwell(dt);
  if(mode==='open'&&!usingMouse&&!ohDone){oh+=dt;if(oh>=.9){ohDone=true;oh=0;back()}}else if(mode!=='open'){oh=0;ohDone=false}

  if(pts){fx.strokeStyle='rgba(79,216,255,.7)';fx.lineWidth=2;fx.beginPath();BONES.forEach(([a,b])=>{fx.moveTo(pts[a].x,pts[a].y);fx.lineTo(pts[b].x,pts[b].y)});fx.stroke();fx.fillStyle='#fff';pts.forEach(p=>{fx.beginPath();fx.arc(p.x,p.y,3,0,7);fx.fill()})}
  if(ptr.on&&(scene==='home'||!hit)){fx.strokeStyle='#4fd8ff';fx.lineWidth=3;fx.beginPath();fx.arc(ptr.x,ptr.y,18,0,7);fx.stroke()}
  if(ptr.on&&dw.t>0){fx.strokeStyle='#ffd24f';fx.lineWidth=7;fx.beginPath();fx.arc(ptr.x,ptr.y,30,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,dw.t));fx.stroke()}
  if(oh>0&&pts){const c=pts[9];fx.strokeStyle='#ff7a5c';fx.lineWidth=7;fx.beginPath();fx.arc(c.x,c.y,34,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,oh/.9));fx.stroke()}
  $('hint').textContent=(now-hintT<2800)?hint:'';
  requestAnimationFrame(frame);
}

// ===== الكاميرا =====
async function startCamera(){
  const btn=$('goCam');
  if(typeof Hands==='undefined'){alert(tr('libFail'));return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert(tr('noCam'));return}
  btn.disabled=true;btn.textContent=tr('camStart');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
    video.srcObject=stream;await video.play();btn.textContent=tr('camModel');
    const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onResults);await hands.initialize();$('ov').remove();setCap();
    (async function pump(){try{if(video.readyState>=2)await hands.send({image:video})}catch(e){}requestAnimationFrame(pump)})();
  }catch(e){btn.disabled=false;btn.textContent=tr('goCam');alert(tr('camErr1')+e.name+' — '+e.message+tr('camErr2'))}
}
function startMouse(){usingMouse=true;$('ov').remove();video.style.display='none';document.body.style.background='linear-gradient(160deg,#10222e,#3a2b1d)';setCap()}

// ===== الماوس واللوحة =====
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.in=true});
addEventListener('pointerdown',e=>{if(!usingMouse||scene!=='dig'||e.target!==cv)return;mouse.x=e.clientX;mouse.y=e.clientY;
  if(mTool==='doc'){const p=hitPiece(rayAt(e.clientX,e.clientY));if(p)openCard(p);else say(tr('uncover'))}else mouse.down=true});
addEventListener('pointerup',()=>mouse.down=false);
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='Backspace')back();
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='v'||e.key==='V')toggleVR();
  else if(e.key==='l'||e.key==='L')$('lang').click();
  else if(scene==='home'&&/^[1-5]$/.test(e.key)&&SITES[+e.key-1])enter(SITES[+e.key-1]);
  else if(scene==='dig'&&/^[1-3]$/.test(e.key))mTool=['pick','brush','doc'][+e.key-1];
});
$('lang').onclick=()=>setLang(LANGS[(LANGS.indexOf(LANG)+1)%3]);
$('goCam').onclick=startCamera;$('goMouse').onclick=startMouse;

applyLang();resize();
Promise.all(Object.keys(SRC).map(k=>new Promise(r=>{IM[k]=new Image();IM[k].onload=r;IM[k].src=SRC[k]}))).then(()=>{renderHome();setCap();requestAnimationFrame(frame)});
// بعد اكتمال تحميل Leaflet وأنماطه من الإنترنت نرسم الخريطة الحقيقية
addEventListener('load',()=>{if(scene==='home'&&$('home').style.display!=='none')renderHome()});
</script>
